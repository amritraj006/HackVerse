name: HackVerse CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Frontend CI: Linting & Production Build
  # ==========================================
  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Vite Production Bundle
        run: npm run build

  # ==========================================
  # Backend CI: Syntax Check & Dependency Audit
  # ==========================================
  backend-ci:
    name: Backend CI (Syntax & Security)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Validate Server Scripts & Syntax
        run: npm test

  # ==========================================
  # Docker Compose Specification Validation
  # ==========================================
  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config

  # ==========================================
  # Docker Multi-Stage Image Builds
  # ==========================================
  docker-build:
    name: Build & Verify Docker Images
    needs: [frontend-ci, backend-ci, docker-compose-validate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: actions/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: hackverse-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: hackverse-client:latest
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_APP_NAME=HackVerse
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # CD Stage: Continuous Delivery Pipeline
  # ==========================================
  cd-pipeline:
    name: Continuous Delivery Readiness
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Report CI/CD Status
        run: |
          echo "=========================================="
          echo "All CI pipeline stages completed successfully!"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Docker images verified and ready for deployment."
          echo "=========================================="
