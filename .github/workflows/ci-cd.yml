name: HackVerse CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# ==========================================
# CI/CD JOBS
# ==========================================
jobs:

  # ==========================================
  # CI: Frontend Linting & Production Build
  # ==========================================
  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      # ------------------------------------------
      # Checkout Repository
      # ------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Setup Node.js
      # ------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # ------------------------------------------
      # Install Dependencies
      # ------------------------------------------
      - name: Install Client Dependencies
        run: npm ci

      # ------------------------------------------
      # Lint
      # ------------------------------------------
      - name: Run ESLint
        run: npm run lint

      # ------------------------------------------
      # Production Build
      # ------------------------------------------
      - name: Build Vite Production Bundle
        run: npm run build


  # ==========================================
  # CI: Backend Tests & Validation
  # ==========================================
  backend-ci:
    name: Backend CI (Test & Validation)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      # ------------------------------------------
      # Checkout Repository
      # ------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Setup Node.js
      # ------------------------------------------
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # ------------------------------------------
      # Install Dependencies
      # ------------------------------------------
      - name: Install Server Dependencies
        run: npm ci

      # ------------------------------------------
      # Backend Tests
      # ------------------------------------------
      - name: Run Backend Tests
        run: npm test


  # ==========================================
  # CI: Docker Compose Validation
  # ==========================================
  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # Checkout Repository
      # ------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Validate Docker Compose
      # ------------------------------------------
      - name: Validate Docker Compose
        run: docker compose config


  # ==========================================
  # CI: Docker Image Builds
  # ==========================================
  docker-build:
    name: Build Docker Images

    needs:
      - frontend-ci
      - backend-ci
      - docker-compose-validate

    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # Checkout Repository
      # ------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # Setup Docker Buildx
      # ------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------
      # Build Backend Docker Image
      # ------------------------------------------
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: hackverse-server:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------
      # Build Frontend Docker Image
      # ------------------------------------------
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: hackverse-client:latest

          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_APP_NAME=HackVerse

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================
  # CD: Deploy Frontend & Backend to Render
  # ==========================================
  deploy:
    name: Deploy HackVerse to Render

    needs:
      - docker-build

    # Deploy ONLY after successful push to main.
    # Pull requests will run CI but will NOT deploy.
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Validate Render Secrets
      # ==========================================
      - name: Check Render Deploy Hooks
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$BACKEND_HOOK" ]; then
            echo "ERROR: RENDER_BACKEND_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          if [ -z "$FRONTEND_HOOK" ]; then
            echo "ERROR: RENDER_FRONTEND_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi

          echo "Both Render deploy hooks are configured."


      # ==========================================
      # Deploy Backend to Render
      # ==========================================
      - name: Deploy Backend to Render
        env:
          RENDER_BACKEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering backend deployment..."

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_BACKEND_DEPLOY_HOOK_URL"

          echo "Backend deployment triggered successfully."


      # ==========================================
      # Deploy Frontend to Render
      # ==========================================
      - name: Deploy Frontend to Render
        env:
          RENDER_FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering frontend deployment..."

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_FRONTEND_DEPLOY_HOOK_URL"

          echo "Frontend deployment triggered successfully."


      # ==========================================
      # Deployment Information
      # ==========================================
      - name: Deployment Triggered Successfully
        run: |
          echo "=========================================="
          echo "HackVerse CI/CD Pipeline"
          echo "=========================================="
          echo "CI Status: PASSED"
          echo "Docker Build: PASSED"
          echo "Backend: Render deployment triggered"
          echo "Frontend: Render deployment triggered"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "=========================================="