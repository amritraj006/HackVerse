name: HackVerse CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


# ==========================================
# CI: Frontend Linting & Production Build
# ==========================================
jobs:

  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Vite Production Bundle
        run: npm run build


  # ==========================================
  # CI: Backend Tests & Validation
  # ==========================================
  backend-ci:
    name: Backend CI (Test & Validation)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test


  # ==========================================
  # CI: Docker Compose Validation
  # ==========================================
  docker-compose-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config


  # ==========================================
  # CI: Docker Image Builds
  # ==========================================
  docker-build:
    name: Build Docker Images

    needs:
      - frontend-ci
      - backend-ci
      - docker-compose-validate

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # Docker Buildx
      # ------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ------------------------------------------
      # Build Backend Image
      # ------------------------------------------
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: hackverse-server:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ------------------------------------------
      # Build Frontend Image
      # ------------------------------------------
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: hackverse-client:latest

          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_APP_NAME=HackVerse

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================
  # CD: Deploy to Render
  # ==========================================
  deploy:
    name: Deploy HackVerse to Render

    needs:
      - docker-build

    # Deploy ONLY after a successful push to main.
    # Pull requests will run CI but will NOT deploy.
    if: >
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # Trigger Render Deployment
      # ------------------------------------------
      - name: Trigger Render Deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}"

      # ------------------------------------------
      # Deployment Information
      # ------------------------------------------
      - name: Deployment Triggered Successfully
        run: |
          echo "=========================================="
          echo "HackVerse CI/CD Pipeline"
          echo "=========================================="
          echo "CI Status: PASSED"
          echo "Docker Build: PASSED"
          echo "CD Status: Render deployment triggered"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "=========================================="